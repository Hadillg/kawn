<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>KAWN</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
:root{--bg:#fff;--fg:#111;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--fg:#f2f2f2}}
:root[data-theme="dark"]{--bg:#111;--fg:#f2f2f2}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;display:flex;flex-direction:column}
h1{text-align:center;letter-spacing:.3em;margin:14px 0 0;font-size:20px}
.big{display:block;margin:12px auto;font-size:18px;padding:14px 22px;font-weight:700;background:#d4a533;color:#000;border:0;border-radius:12px;transition:transform .2s ease}
.big:active{transform:scale(.96)}
.bar{padding:6px 12px;text-align:center;font-size:14px;min-height:20px}
model-viewer{flex:1;width:100%;opacity:0;transition:opacity 1.2s ease;--poster-color:transparent}
model-viewer.on{opacity:1}
</style></head><body>
<h1>KAWN <small style="font-size:10px;opacity:.5">v4</small></h1>
<button class="big" id="arb">عرض المجسم بتقنية AR</button>
<div class="bar" id="msg">جارٍ تحميل المجسم...</div>
<model-viewer id="mv" src="map2.glb" alt="KAWN" camera-controls interaction-prompt="none"
 shadow-intensity="1" interpolation-decay="120" camera-orbit="0deg 75deg auto"
 ar ar-modes="webxr scene-viewer quick-look"></model-viewer>
<script>
const mv=document.getElementById('mv'),msg=document.getElementById('msg');
mv.addEventListener('progress',e=>{const p=e.detail.totalProgress;if(p<1)msg.textContent='جارٍ تحميل المجسم... '+Math.round(p*100)+'%'});
mv.addEventListener('load',()=>{msg.textContent='اضغط الزر ووافق على الكاميرا ليظهر المجسم أمامك';mv.classList.add('on')});
mv.addEventListener('error',()=>{msg.textContent='تعذّر تحميل المجسم، أعد فتح الصفحة'});
document.getElementById('arb').onclick=()=>{if(mv.canActivateAR){mv.activateAR()}else{msg.textContent='جوالك لا يدعم AR، يمكنك تدوير المجسم بإصبعك'}};
// دوران بطيء وانسيابي: يبدأ تدريجيًا، ويتوقف عند لمس المستخدم ثم يعود بسلاسة
let theta=0,speed=0,last=performance.now(),touching=false,resumeAt=0,needSync=false;
const TARGET=40; // درجة في الثانية (دورة كاملة كل 9 ثوانٍ)
mv.addEventListener('pointerdown',()=>{touching=true});
const up=()=>{if(touching){touching=false;resumeAt=performance.now()+2500;needSync=true}};
addEventListener('pointerup',up);addEventListener('pointercancel',up);
function frame(t){
 const dt=Math.min(0.05,(t-last)/1000);last=t;
 const goal=(touching||t<resumeAt)?0:TARGET;
 speed+=(goal-speed)*Math.min(1,dt*2.5);
 if(speed>0.05){
  let o=null;try{o=mv.getCameraOrbit()}catch(e){}
  if(needSync&&o){theta=o.theta*180/Math.PI;needSync=false}
  if(o){theta=(theta+speed*dt)%360;
   mv.cameraOrbit=theta+'deg '+(o.phi*180/Math.PI)+'deg '+o.radius+'m'}
 }
 requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></body></html>
